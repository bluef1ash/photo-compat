[package]
name = "photo-compat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photo_compat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
kamadak-exif = "0.5"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1"
walkdir = "2"
opener = "0.7"
tokio = "1"
chrono = "0.4"
jpeg-encoder = "0.7.0"
lcms2 = { version = "6.1.1", features = ["static"] }
libheif-rs = { version = "2.7", optional = true, features = ["embedded-libheif", "image"] }

[dev-dependencies]
tempfile = "3"

[features]
# HEIC/HEIF 解码：启用后引入 libheif（embedded-libheif 从源码编译）。
# 默认关闭（opt-in）：HEIC 需要较重的原生依赖，默认构建不含以保证三端开箱即用。
# - Linux 构建需 cmake + C++ 编译器（详见 README「编译依赖」）。
# - Windows(MSVC) 构建需 vcpkg 提供 libheif（见 libheif-sys 文档）。
# 关闭本特性则 HEIC 文件按「不支持」跳过，其余功能不受影响。
default = []
heic = ["dep:libheif-rs"]
